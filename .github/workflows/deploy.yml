name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      port:
        description: "SSH port on the VPS (overrides the VPS_PORT secret / default 22)"
        required: false
        default: "22"

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout (for scripts/deploy.sh)
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          # Port precedence: manual-run input -> VPS_PORT secret -> 22
          VPS_PORT: ${{ github.event.inputs.port || secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          cat > ~/.ssh/config <<EOF
          Host vps
            HostName $VPS_HOST
            User $VPS_USER
            Port $VPS_PORT
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking accept-new
            ConnectTimeout 60
            ServerAliveInterval 30
            ServerAliveCountMax 5
          EOF
          chmod 600 ~/.ssh/config

      - name: Check VPS reachability (fail fast with a clear message)
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ github.event.inputs.port || secrets.VPS_PORT || '22' }}
        run: |
          echo "Resolving $VPS_HOST ..."
          # A Cloudflare-proxied domain resolves to 104.x / 172.67.x / 2606:4700::
          # addresses, which do NOT forward SSH — set VPS_HOST to the raw VPS IP.
          getent hosts "$VPS_HOST" || nslookup "$VPS_HOST" || true

          echo "Checking TCP reachability to $VPS_HOST:$VPS_PORT ..."
          if nc -vz -w 10 "$VPS_HOST" "$VPS_PORT"; then
            echo "TCP $VPS_PORT is reachable."
          else
            echo "::error::Cannot open TCP $VPS_PORT on $VPS_HOST. Check that VPS_HOST is the raw VPS IP (NOT a Cloudflare-proxied domain) and that the provider firewall allows port $VPS_PORT from GitHub runners."
            exit 1
          fi

          echo "Verbose SSH handshake test (BatchMode, no password prompt) ..."
          # Diagnostic only: the deploy step below is authoritative. This makes it
          # obvious whether a failure is a network block vs. an auth/key problem.
          ssh -vvv -o BatchMode=yes -o ConnectTimeout=15 vps 'echo "SSH OK on $(hostname)"' || true

      - name: Deploy on VPS (retry on transient SSH failures)
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 25
          max_attempts: 3
          retry_wait_seconds: 30
          command: ssh vps 'bash -s' < scripts/deploy.sh
