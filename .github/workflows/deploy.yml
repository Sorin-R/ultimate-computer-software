name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail

            # ---- Pull latest from GitHub ----
            cd /root/Documents/project/ultimate-computer-software
            git fetch origin main
            git reset --hard origin/main

            # ---- Sync source to /opt (build context) ----
            cp -r frontend /opt/ultimate-computer-software/
            cp -r backend /opt/ultimate-computer-software/

            # ---- Build & deploy ----
            cd /opt/ultimate-computer-software
            docker compose -f docker-compose.production.yml --env-file .env.production build web
            docker compose -f docker-compose.production.yml --env-file .env.production up -d postgres
            docker compose -f docker-compose.production.yml --env-file .env.production run --rm --no-deps web npx prisma migrate deploy
            docker compose -f docker-compose.production.yml --env-file .env.production up -d web
            docker image prune -f

            # ---- Health check ----
            sleep 5
            web_ip=$(docker inspect -f '{{range.NetworkSettings.Networks}}{{.IPAddress}}{{end}}' ucs-web)
            curl -fsS "http://${web_ip}:4000/api/health" >/dev/null || docker logs --tail=120 ucs-web

            echo "✅ Deploy complete"
